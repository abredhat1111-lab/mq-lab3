merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: require-review-and-ci
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = ci

pull_request_rules:
  - name: dismiss stale approvals
    conditions:
      - base = main
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
